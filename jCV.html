<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download CV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    section.download-cv {
      padding: 50px;
      text-align: center;
      background-color: #f4f4f4;
    }

    section.download-cv h2 {
      margin-bottom: 20px;
    }

    .download-button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .download-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Section lainnya -->

  <section class="download-cv">
    <h2>Unduh CV Saya</h2>
    <a
      class="download-button"
      href="https://drive.google.com/file/d/1CEwV7L1MisHYaIDTd5xPgR9uf0Fjxxr7/view?usp=drivesdk"
      download>
      Download CV
    </a>
  </section>

  <!-- Section lainnya -->

</body>
</html>
